<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Estate | DCCV</title>

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:#fff;
}

header{
background:#0b1f3a;
padding:15px 40px;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
}

nav h1{ color:#f4b400; }

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#111;
border-radius:10px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,0.6);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.price{
color:#f4b400;
font-size:20px;
font-weight:bold;
}

button{
background:#f4b400;
border:none;
padding:10px;
margin-top:10px;
cursor:pointer;
width:100%;
font-weight:bold;
}

/* FORM */
.form-box{
background:#111;
padding:30px;
margin:30px auto;
max-width:500px;
border-radius:10px;
text-align:center;
}

input, textarea{
width:85%;
padding:10px;
margin:10px;
border:none;
border-radius:5px;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50%;
color:white;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<nav>
<h1>DCCV</h1>
<div>
<a href="index.html">Home</a>
</div>
</nav>
</header>

<h2 style="text-align:center; margin-top:30px;">🏘 Property Listings</h2>

<div class="grid" id="propertyGrid"></div>

<!-- ADD PROPERTY -->
<div class="form-box">
<h3>Add Property</h3>
<input type="text" id="pname" placeholder="Property Name">
<input type="text" id="pprice" placeholder="Price">
<textarea id="pdesc" placeholder="Description"></textarea>
<input type="file" id="pimage">
<button onclick="addProperty()">Add Property</button>
</div>

<!-- APPOINTMENT FORM -->
<div class="form-box">
<h3>Book Appointment</h3>
<input type="text" id="name" placeholder="Your Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="property" placeholder="Property Name">
<button onclick="book()">Book Now</button>
</div>

<a class="whatsapp" href="https://wa.me/918402933354">Chat</a>

<script>

// DEFAULT + SAVED DATA
let properties = JSON.parse(localStorage.getItem("properties")) || [
{
name:"2BHK House - Silchar",
price:"₹35,00,000",
img:"https://images.unsplash.com/photo-1568605114967-8130f3a36994",
desc:"Ready to move 2BHK house in prime location."
},
{
name:"Residential Plot",
price:"₹10,00,000",
img:"https://images.unsplash.com/photo-1507089947368-19c1da9775ae",
desc:"1200 sq ft land available for construction."
},
{
name:"Commercial Building",
price:"₹75,00,000",
img:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab",
desc:"Perfect for office or showroom."
}
];

// DISPLAY
function displayProperties(){
const grid = document.getElementById("propertyGrid");
grid.innerHTML = "";

properties.forEach(p=>{
grid.innerHTML += `
<div class="card">
<img src="${p.img}">
<div class="card-content">
<h3>${p.name}</h3>
<p class="price">${p.price}</p>
<p>${p.desc}</p>
<button onclick="enquire('${p.name}')">Enquire</button>
</div>
</div>
`;
});
}

displayProperties();

// ADD PROPERTY
function addProperty(){
let name = document.getElementById("pname").value;
let price = document.getElementById("pprice").value;
let desc = document.getElementById("pdesc").value;
let file = document.getElementById("pimage").files[0];

if(!name || !price || !desc || !file){
alert("Fill all fields!");
return;
}

let reader = new FileReader();

reader.onload = function(e){
let newProperty = {
name:name,
price:price,
desc:desc,
img:e.target.result
};

properties.push(newProperty);
localStorage.setItem("properties", JSON.stringify(properties));

displayProperties();

alert("Property Added ✅");

// CLEAR FORM
document.getElementById("pname").value="";
document.getElementById("pprice").value="";
document.getElementById("pdesc").value="";
document.getElementById("pimage").value="";
}

reader.readAsDataURL(file);
}

// WHATSAPP ENQUIRY
function enquire(name){
window.open(`https://wa.me/918402933354?text=I am interested in ${name}`);
}

// BOOK APPOINTMENT
function book(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let property=document.getElementById("property").value;

let msg = 
"REAL ESTATE APPOINTMENT %0A%0A"+
"Name: "+name+"%0A"+
"Phone: "+phone+"%0A"+
"Property: "+property;

window.open("https://wa.me/918402933354?text="+msg);
}

</script>

</body>
</html>
