<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DCCV A–Z Services</title>

<style>
body{margin:0;font-family:Arial;background:#000;color:#fff;}
header{background:#0b1f3a;padding:15px;text-align:center;}
h1{color:#f4b400;}

.container{padding:20px;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#111;border-radius:10px;overflow:hidden;
border:1px solid #222;transition:0.3s;
}
.card:hover{transform:scale(1.05);border-color:#f4b400;}

.card img{width:100%;height:150px;object-fit:cover;}

.card-content{padding:15px;}
.icon{font-size:22px;color:#f4b400;}

button{
background:#f4b400;border:none;padding:10px;
cursor:pointer;width:100%;margin-top:10px;
}

input,textarea{
width:100%;padding:10px;margin:5px 0;
border:none;border-radius:5px;
}

/* LOGIN */
.login-box{
max-width:320px;margin:30px auto;
background:#111;padding:20px;border-radius:10px;
}

/* FORM */
.form-box{
background:#111;padding:20px;margin-top:30px;border-radius:10px;
}

/* ADMIN */
.admin{
display:none;
background:#0b1f3a;
padding:20px;
margin-top:30px;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1>DCCV A–Z Services</h1>
<p>Modern Construction | Fast | Cost Efficient</p>
</header>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
<h3>Admin Login</h3>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="container">

<div class="grid" id="services"></div>

<!-- LEAD FORM -->
<div class="form-box">
<h2>📞 Get a Quote</h2>
<input type="text" id="name" placeholder="Your Name">
<input type="text" id="phone" placeholder="Phone Number">
<textarea id="message" placeholder="Your Requirement"></textarea>
<button onclick="submitLead()">Send via WhatsApp</button>
</div>

<!-- ADMIN PANEL -->
<div class="admin" id="adminPanel">
<h2>⚙️ Admin Panel</h2>
<input type="text" id="title" placeholder="Service Title (A - Architecture)">
<input type="text" id="desc" placeholder="Description">
<input type="text" id="img" placeholder="Image URL">
<input type="text" id="icon" placeholder="Icon (emoji)">
<button onclick="addService()">Add Service</button>
</div>

</div>

<!-- FIREBASE v10 -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};

const WHATSAPP_NUMBER = "91XXXXXXXXXX";

// INIT
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// LOGIN
window.login = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try{
    await signInWithEmailAndPassword(auth, email, password);
    alert("Login Success");
  }catch(e){
    alert("Login Failed");
  }
}

// AUTH STATE
onAuthStateChanged(auth, (user)=>{
  if(user){
    document.getElementById("adminPanel").style.display="block";
    document.getElementById("loginBox").style.display="none";
  }
});

// LOAD SERVICES
const container = document.getElementById("services");

async function loadServices(){
  container.innerHTML="";
  const querySnapshot = await getDocs(collection(db,"services"));
  
  querySnapshot.forEach(doc=>{
    const s = doc.data();
    container.innerHTML += `
    <div class="card">
      <img src="${s.img}">
      <div class="card-content">
        <div class="icon">${s.icon}</div>
        <h3>${s.title}</h3>
        <p>${s.desc}</p>
      </div>
    </div>`;
  });
}

loadServices();

// ADD SERVICE
window.addService = async function(){
  const title=document.getElementById("title").value;
  const desc=document.getElementById("desc").value;
  const img=document.getElementById("img").value;
  const icon=document.getElementById("icon").value;

  await addDoc(collection(db,"services"),{
    title,desc,img,icon
  });

  alert("Service Added");
  loadServices();
}

// WHATSAPP LEAD
window.submitLead = async function(){
  const name=document.getElementById("name").value;
  const phone=document.getElementById("phone").value;
  const message=document.getElementById("message").value;

  const text = `New Lead:%0AName: ${name}%0APhone: ${phone}%0ARequirement: ${message}`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${text}`;

  // Open WhatsApp
  window.open(url, "_blank");

  // Save to DB
  await addDoc(collection(db,"leads"),{
    name,phone,message,date:new Date()
  });
}
</script>

</body>
</html>
