<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCCV Construction Materials Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:white;
text-align:center;
}

header{
background:#0b1f3a;
padding:20px;
position:relative;
}

h1{ color:#f4b400; }

.admin-btn{
position:absolute;
right:20px;
top:20px;
background:#00ffcc;
color:black;
padding:8px 15px;
cursor:pointer;
border-radius:5px;
}

/* SEARCH */
.search-box{
padding:10px;
background:#111;
}

.search-box input{
width:90%;
padding:10px;
}

/* FILTER */
.filters{
padding:10px;
background:#111;
}

select{
padding:10px;
margin:5px;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
padding:15px;
border-radius:10px;
}

button{
background:#f4b400;
border:none;
padding:10px;
cursor:pointer;
margin-top:5px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
border:1px solid #444;
padding:10px;
}

.total{
font-size:20px;
margin-top:20px;
color:#f4b400;
}

.qty-btn{
padding:5px 10px;
font-size:18px;
margin:5px;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<header>
<h1>DCCV CONSTRUCTION MATERIAL STORE</h1>
<div class="admin-btn" onclick="goAdmin()">Admin Panel</div>
</header>

<!-- SEARCH -->
<div class="search-box">
<input type="text" id="search" placeholder="Search material..." onkeyup="searchProducts()">
</div>

<!-- FILTER -->
<div class="filters">
<select id="categoryFilter" onchange="applyFilter()">
<option value="">All Category</option>
</select>

<select id="subCategoryFilter" onchange="applyFilter()">
<option value="">All Subcategory</option>
</select>
</div>

<!-- PRODUCTS -->
<div class="products" id="productList"></div>

<!-- CART -->
<div class="container">
<div class="order-box">

<input type="text" id="name" placeholder="Customer Name">
<input type="text" id="phone" placeholder="Phone Number">

<table id="cart">
<tr>
<th>Material</th>
<th>Qty</th>
<th>Price</th>
<th>Action</th>
</tr>
</table>

<div class="total">Total: ₹<span id="total">0</span></div>

<input type="text" id="location" placeholder="Delivery Location">

<button onclick="payUPI()">💳 Pay via UPI</button>
<button onclick="placeOrder()">Send Order on WhatsApp</button>
<button onclick="downloadInvoice()">Download GST Invoice</button>

</div>
</div>

<script>

// PRODUCTS WITH CATEGORY
let allProducts = [
{name:"Fly Ash Brick",category:"Bricks",subCategory:"Standard",price:7,stock:5000},
{name:"River Sand",category:"Sand",subCategory:"Natural",price:60,stock:1200},
{name:"M Sand",category:"Sand",subCategory:"Manufactured",price:55,stock:900},
{name:"20mm Aggregate",category:"Stone",subCategory:"Aggregate",price:78,stock:750},
{name:"UltraTech OPC 53",category:"Cement",subCategory:"OPC",price:440,stock:180},
{name:"Ambuja PPC",category:"Cement",subCategory:"PPC",price:395,stock:220},
{name:"TMT Steel Rod",category:"Steel",subCategory:"TMT",price:70,stock:300}
];

let cartItems=[];
let total=0;

const productList=document.getElementById("productList");

// LOAD FILTERS
function loadFilters(){
let cats=[...new Set(allProducts.map(p=>p.category))];
cats.forEach(c=>{
categoryFilter.innerHTML+=`<option value="${c}">${c}</option>`;
});
}

// DISPLAY
function displayProducts(list){
productList.innerHTML="";
list.forEach((p,i)=>{
productList.innerHTML+=`
<div class="card">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
<p>Stock: ${p.stock}</p>

<input type="number" id="qty${i}" placeholder="Qty">

<button onclick="addToCart(${i})">Add</button>
</div>`;
});
}

// SEARCH
function searchProducts(){
let val=search.value.toLowerCase();
let f=allProducts.filter(p=>p.name.toLowerCase().includes(val));
displayProducts(f);
}

// FILTER
function applyFilter(){
let cat=categoryFilter.value;
let sub=subCategoryFilter.value;

let f=allProducts.filter(p=>
(!cat||p.category==cat)&&(!sub||p.subCategory==sub)
);

displayProducts(f);
}

// ADD CART
function addToCart(i){
let p=allProducts[i];
let qty=parseInt(document.getElementById("qty"+i).value);

if(!qty||qty<=0) return alert("Enter quantity");
if(qty>p.stock) return alert("Stock not enough");

let itemTotal=p.price*qty;

let row=document.getElementById("cart").insertRow();
row.insertCell(0).innerText=p.name;
row.insertCell(1).innerText=qty;
row.insertCell(2).innerText="₹"+itemTotal;

let btn=document.createElement("button");
btn.innerText="Remove";
btn.onclick=()=>{
total-=itemTotal;
document.getElementById("total").innerText=total;
row.remove();
};

row.insertCell(3).appendChild(btn);

total+=itemTotal;
document.getElementById("total").innerText=total;

cartItems.push({name:p.name,qty:qty,price:itemTotal});
}

// UPI
function payUPI(){
let amt=document.getElementById("total").innerText;
window.location=`upi://pay?pa=deychoudhurybinit@oksbi&pn=DCCV&am=${amt}&cu=INR`;
}

// WHATSAPP ORDER
function placeOrder(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let loc=document.getElementById("location").value;

let msg="DCCV ORDER\n\nCustomer:"+name+"\nPhone:"+phone+"\n";

cartItems.forEach(i=>{
msg+=`${i.name} x ${i.qty}\n`;
});

msg+="\nTotal ₹"+total+"\nLocation:"+loc;

window.open("https://wa.me/918402933354?text="+encodeURIComponent(msg));
}

// INVOICE
function downloadInvoice(){
const { jsPDF } = window.jspdf;
let doc=new jsPDF();

doc.text("DCCV GST Invoice",20,20);

let y=40;
cartItems.forEach(i=>{
doc.text(`${i.name} x ${i.qty} ₹${i.price}`,20,y);
y+=10;
});

let gst=total*0.18;
doc.text("GST: ₹"+gst,20,y+10);
doc.text("Total: ₹"+(total+gst),20,y+20);

doc.save("DCCV_Invoice.pdf");
}

// ADMIN
function goAdmin(){
window.location="admin-material.html";
}

// INIT
loadFilters();
displayProducts(allProducts);

</script>

</body>
</html>
