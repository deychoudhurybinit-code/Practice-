<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Admin | DCCV</title>

<style>
body{
  background:#000;
  color:white;
  font-family:Arial;
  padding:20px;
}

input, select{
  display:block;
  margin:10px 0;
  padding:10px;
  width:300px;
}

button{
  padding:10px 20px;
  background:#0b1f3a;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>Add Hardware Product</h2>

<input type="text" id="name" placeholder="Product Name">
<input type="text" id="category" placeholder="Category (Cement, Steel)">
<input type="text" id="subCategory" placeholder="Subcategory (TMT, OPC)">
<input type="text" id="size" placeholder="Size (optional)">
<input type="number" id="price" placeholder="Price">
<input type="number" id="discount" placeholder="Discount %">
<input type="number" id="quantity" placeholder="Quantity">
<input type="text" id="description" placeholder="Description">
<input type="file" id="image" accept="image/*">

<button onclick="uploadProduct()">Upload Product</button>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

// ✅ Your Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAMcxTpBPc8F3acHGsYRxPWyNa4iLOlHIM",
  authDomain: "dccv-construction.firebaseapp.com",
  databaseURL: "https://dccv-construction-default-rtdb.firebaseio.com",
  projectId: "dccv-construction",
  storageBucket: "dccv-construction.firebasestorage.app",
  messagingSenderId: "897766209300",
  appId: "1:897766209300:web:189fa70eb8033691ba3401",
  measurementId: "G-W3MT4X1H88"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);
const storage = getStorage(app);

async function uploadProduct(){
  const name = document.getElementById("name").value.trim();
  const category = document.getElementById("category").value.trim();
  const subCategory = document.getElementById("subCategory").value.trim();
  const size = document.getElementById("size").value.trim();
  const price = Number(document.getElementById("price").value);
  const discount = Number(document.getElementById("discount").value);
  const quantity = Number(document.getElementById("quantity").value);
  const description = document.getElementById("description").value.trim();
  const imageFile = document.getElementById("image").files[0];

  if(!name || !category || !subCategory || !price || !quantity || !description){
    alert("Please fill all required fields!");
    return;
  }
  if(!imageFile){
    alert("Please select an image file!");
    return;
  }

  try{
    // Upload image to Firebase Storage
    const imageRef = ref(storage, "hardware/" + Date.now() + "_" + imageFile.name);
    await uploadBytes(imageRef, imageFile);
    const imageURL = await getDownloadURL(imageRef);

    // Save product to Firestore (no createdAt)
    await addDoc(collection(db, "hardware"), {
      name,
      category,
      subCategory,
      size,
      price,
      discount,
      quantity,
      description,
      image: imageURL
    });

    alert("Product Uploaded ✅");

    // Clear inputs
    document.querySelectorAll('input').forEach(i => i.value = "");
    document.getElementById("image").value = "";

  } catch(error){
    console.error(error);
    alert("Error uploading product: " + error.message);
  }
}
</script>

</body>
</html>
