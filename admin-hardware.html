<!DOCTYPE html>
<html>
<head>
<title>Hardware Admin | DCCV</title>

<style>
body{
background:#000;
color:white;
font-family:Arial;
padding:20px;
}

input, select{
display:block;
margin:10px 0;
padding:10px;
width:300px;
}

button{
padding:10px 20px;
background:#0b1f3a;
color:white;
border:none;
cursor:pointer;
}
</style>
</head>

<body>

<h2>Add Hardware Product</h2>

<input type="text" id="name" placeholder="Product Name">
<input type="text" id="category" placeholder="Category (Cement, Steel)">
<input type="text" id="subCategory" placeholder="Subcategory (TMT, OPC)">
<input type="text" id="size" placeholder="Size (optional)">
<input type="number" id="price" placeholder="Price">
<input type="number" id="discount" placeholder="Discount %">
<input type="number" id="quantity" placeholder="Quantity">
<input type="text" id="description" placeholder="Description">
<input type="file" id="image">

<button onclick="uploadProduct()">Upload Product</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

<script>
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID",
storageBucket: "YOUR_BUCKET",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

async function uploadProduct(){

let file = document.getElementById("image").files[0];

let storageRef = storage.ref("hardware/" + file.name);
await storageRef.put(file);

let imageURL = await storageRef.getDownloadURL();

await db.collection("hardware").add({
name: document.getElementById("name").value,
category: document.getElementById("category").value,
subCategory: document.getElementById("subCategory").value,
size: document.getElementById("size").value,
price: Number(document.getElementById("price").value),
discount: Number(document.getElementById("discount").value),
quantity: Number(document.getElementById("quantity").value),
description: document.getElementById("description").value,
image: imageURL
});

alert("Product Uploaded ✅");
}
</script>

</body>
</html>
