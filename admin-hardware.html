<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Admin | DCCV</title>

<style>
body{
  background:#000;
  color:white;
  font-family:Arial;
  padding:20px;
}

input{
  display:block;
  margin:10px 0;
  padding:10px;
  width:300px;
}

button{
  padding:10px 20px;
  background:#0b1f3a;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>Add Hardware Product</h2>

<input type="text" id="name" placeholder="Product Name">
<input type="text" id="category" placeholder="Category (Cement, Steel)">
<input type="text" id="subCategory" placeholder="Subcategory (TMT, OPC)">
<input type="text" id="size" placeholder="Size (optional)">
<input type="number" id="price" placeholder="Price">
<input type="number" id="discount" placeholder="Discount %">
<input type="number" id="quantity" placeholder="Quantity">
<input type="text" id="description" placeholder="Description">
<input type="file" id="image" accept="image/*">

<button onclick="uploadProduct()">Upload Product</button>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const SUPABASE_URL = "YOUR_PROJECT_URL";   // 🔥 Paste here
const SUPABASE_KEY = "YOUR_ANON_KEY";     // 🔥 Paste here

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🚀 Upload Function
async function uploadProduct(){

  const name = document.getElementById("name").value.trim();
  const category = document.getElementById("category").value.trim();
  const subCategory = document.getElementById("subCategory").value.trim();
  const size = document.getElementById("size").value.trim();
  const price = Number(document.getElementById("price").value);
  const discount = Number(document.getElementById("discount").value);
  const quantity = Number(document.getElementById("quantity").value);
  const description = document.getElementById("description").value.trim();
  const file = document.getElementById("image").files[0];

  if(!name || !category || !subCategory || !price || !quantity){
    alert("Please fill required fields!");
    return;
  }

  try{

    let image_url = "";

    // 📤 Upload Image
    if(file){
      const fileName = Date.now() + "-" + file.name;

      const { error: uploadError } = await supabaseClient.storage
        .from("hardware")
        .upload(fileName, file);

      if(uploadError){
        alert("Image upload failed!");
        return;
      }

      image_url = `${SUPABASE_URL}/storage/v1/object/public/hardware/${fileName}`;
    }

    // 📊 Save Product Data
    const { error } = await supabaseClient
      .from("hardware_items")
      .insert([{
        name,
        category,
        subCategory,
        size,
        price,
        discount,
        quantity,
        description,
        image: image_url
      }]);

    if(error){
      alert("Error saving product!");
      console.log(error);
      return;
    }

    alert("Product Uploaded Successfully ✅");

    // 🔄 Clear Inputs
    document.querySelectorAll("input").forEach(i => i.value="");

  }catch(err){
    alert("Error: " + err.message);
  }
}
</script>

</body>
</html>
