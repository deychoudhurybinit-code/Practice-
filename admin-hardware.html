<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Admin | DCCV</title>

<style>
body{
  background:#000;
  color:white;
  font-family:Arial;
  padding:20px;
}
input, select{
  display:block;
  margin:10px 0;
  padding:10px;
  width:300px;
}
button{
  padding:10px 20px;
  background:#0b1f3a;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>Add Hardware Product</h2>

<input type="text" id="name" placeholder="Product Name">
<input type="text" id="category" placeholder="Category (Cement, Steel)">
<input type="text" id="subCategory" placeholder="Subcategory (TMT, OPC)">
<input type="text" id="size" placeholder="Size (optional)">
<input type="number" id="price" placeholder="Price">
<input type="number" id="discount" placeholder="Discount %">
<input type="number" id="quantity" placeholder="Quantity">
<input type="text" id="description" placeholder="Description">
<input type="file" id="image">

<button onclick="uploadProduct()">Upload Product</button>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
  storageBucket: "YOUR_BUCKET",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

async function uploadProduct(){
  const fileInput = document.getElementById("image");
  if(fileInput.files.length === 0){
    alert("Please select an image");
    return;
  }

  const file = fileInput.files[0];
  const storageRef = ref(storage, "hardware/" + Date.now() + "_" + file.name);

  // Upload image
  await uploadBytes(storageRef, file);
  const imageURL = await getDownloadURL(storageRef);

  // Save product to Firestore
  await addDoc(collection(db, "hardware"), {
    name: document.getElementById("name").value,
    category: document.getElementById("category").value,
    subCategory: document.getElementById("subCategory").value,
    size: document.getElementById("size").value,
    price: Number(document.getElementById("price").value),
    discount: Number(document.getElementById("discount").value),
    quantity: Number(document.getElementById("quantity").value),
    description: document.getElementById("description").value,
    image: imageURL,
    createdAt: new Date()
  });

  alert("Product Uploaded ✅");

  // Clear form
  document.querySelectorAll('input, textarea').forEach(i => i.value = "");
  fileInput.value = "";
}
</script>

</body>
</html>
