<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | DCCV</title>

<style>
body{
  background:#000;
  color:white;
  font-family:Arial;
  padding:20px;
}

input{
  display:block;
  margin:10px 0;
  padding:10px;
  width:300px;
}

button{
  padding:10px 20px;
  background:#0b1f3a;
  color:white;
  border:none;
  cursor:pointer;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<!-- LOGIN SECTION -->
<div id="loginBox">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Enter your email">
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

<h2>Add Hardware Product</h2>

<input type="text" id="name" placeholder="Product Name">
<input type="text" id="category" placeholder="Category">
<input type="text" id="subCategory" placeholder="Subcategory">
<input type="text" id="size" placeholder="Size">
<input type="number" id="price" placeholder="Price">
<input type="number" id="discount" placeholder="Discount %">
<input type="number" id="quantity" placeholder="Quantity">
<input type="text" id="description" placeholder="Description">
<input type="file" id="image">

<button onclick="uploadProduct()">Upload Product</button>
<button onclick="logout()">Logout</button>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const SUPABASE_URL = "YOUR_PROJECT_URL";
const SUPABASE_KEY = "YOUR_ANON_KEY";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ✅ Allowed Emails
const allowedUsers = [
  "deychoudhurybinit@gmail.com",
  "deychoudhuryconstructionventur@gmail.com"
];

// 🔐 LOGIN
async function login(){
  const email = document.getElementById("email").value.trim();

  if(!allowedUsers.includes(email)){
    alert("Access Denied ❌");
    return;
  }

  const { error } = await supabaseClient.auth.signInWithOtp({
    email: email
  });

  if(error){
    alert("Login error");
  } else {
    alert("Check your email for login link 📩");
  }
}

// 🔍 CHECK LOGIN
async function checkUser(){
  const { data } = await supabaseClient.auth.getUser();

  if(data.user && allowedUsers.includes(data.user.email)){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
  } else {
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("adminPanel").classList.add("hidden");
  }
}

checkUser();

// 🚪 LOGOUT
async function logout(){
  await supabaseClient.auth.signOut();
  location.reload();
}

// 📤 UPLOAD PRODUCT
async function uploadProduct(){

  const name = document.getElementById("name").value.trim();
  const category = document.getElementById("category").value.trim();
  const subCategory = document.getElementById("subCategory").value.trim();
  const size = document.getElementById("size").value.trim();
  const price = Number(document.getElementById("price").value);
  const discount = Number(document.getElementById("discount").value);
  const quantity = Number(document.getElementById("quantity").value);
  const description = document.getElementById("description").value.trim();
  const file = document.getElementById("image").files[0];

  if(!name || !category || !subCategory || !price || !quantity){
    alert("Fill required fields!");
    return;
  }

  try{
    let image_url = "";

    if(file){
      const fileName = Date.now() + "-" + file.name;

      const { error: uploadError } = await supabaseClient.storage
        .from("hardware")
        .upload(fileName, file);

      if(uploadError){
        alert("Image upload failed!");
        return;
      }

      image_url = `${SUPABASE_URL}/storage/v1/object/public/hardware/${fileName}`;
    }

    const { error } = await supabaseClient
      .from("hardware_items")
      .insert([{
        name,
        category,
        subCategory,
        size,
        price,
        discount,
        quantity,
        description,
        image: image_url
      }]);

    if(error){
      alert("Upload failed!");
      console.log(error);
      return;
    }

    alert("Product Uploaded ✅");

    document.querySelectorAll("input").forEach(i => i.value="");

  }catch(err){
    alert("Error: " + err.message);
  }
}
</script>

</body>
</html>
