<style>
body{margin:0;font-family:Arial;background:#000;color:#fff;}

<body>

<header>

<!-- LOGIN / LOGOUT -->

<!-- AUTH BOX -->
<div id="authBox" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#111;padding:20px;display:none;">
<h3 id="authTitle">Login</h3>
<input id="authName" placeholder="Name" style="display:none;">
<input id="authEmail" placeholder="Email">
<input id="authPassword" placeholder="Password">
<button onclick="loginUser()">Login</button>
<button onclick="signupUser()">Signup</button>
<button onclick="closeAuth()">Close</button>
<p onclick="toggleAuth()">Switch</p>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAMcxTpBPc8F3acHGsYRxPWyNa4iLOlHIM",
  authDomain: "dccv-construction.firebaseapp.com",
  projectId: "dccv-construction"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// UI
function openAuth(){ document.getElementById("authBox").style.display="block"; }
function closeAuth(){ document.getElementById("authBox").style.display="none"; }

let isLogin=true;
function toggleAuth(){
  isLogin=!isLogin;
  document.getElementById("authName").style.display=isLogin?"none":"block";
  document.getElementById("authTitle").innerText=isLogin?"Login":"Signup";
}

// SIGNUP
function signupUser(){
let name=document.getElementById("authName").value.trim();
let email=document.getElementById("authEmail").value.trim();
let pass=document.getElementById("authPassword").value.trim();

if(!name){ alert("Name required"); return; }
if(!email || !pass){ alert("Email & Password required"); return; }

auth.createUserWithEmailAndPassword(email,pass)
.then(user=>{
return db.collection("users").doc(user.user.uid).set({
name:name,
email:email,
role:"user",
createdAt:new Date()
});
})
.then(()=>{
alert("Signup success");
closeAuth();
})
.catch(e=>alert(e.message));
}

// LOGIN
function loginUser(){
let email=document.getElementById("authEmail").value.trim();
let pass=document.getElementById("authPassword").value.trim();

if(!email || !pass){ alert("Enter email & password"); return; }

auth.signInWithEmailAndPassword(email,pass)
.then(()=>{
alert("Login success");
closeAuth();
})
.catch(e=>alert(e.message));
}

// LOGOUT
function logoutUser(){
auth.signOut().then(()=>{
document.getElementById("adminLink").style.display="none";
});
}

// AUTH STATE
auth.onAuthStateChanged(async user=>{

document.getElementById("logoutBtn").style.display=user?"block":"none";
document.getElementById("adminLink").style.display="none";

if(user){
try{
let doc=await db.collection("users").doc(user.uid).get();

if(!doc.exists){
alert("User error, logging out");
auth.signOut();
return;
}

if(doc.data().role==="admin"){
document.getElementById("adminLink").style.display="block";
}

}catch(e){
auth.signOut();
}
}

});

// QUOTE
function sendQuote(){
let name=document.getElementById("qname").value;
let phone=document.getElementById("qphone").value;
let details=document.getElementById("qdetails").value;

if(!name || !phone){
alert("Fill name & phone");
return;
}

let msg="Quote from "+name+" Phone:"+phone+" Details:"+details;
window.open("https://wa.me/918402933354?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
