<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Supply | DCCV</title>

<style>
body{margin:0;font-family:Arial;background:#000;color:#fff;}
header{background:#0b1f3a;padding:15px;text-align:center;font-size:22px;font-weight:bold;position:relative;}
.admin-btn{position:absolute;right:20px;top:15px;background:#00ffcc;color:black;padding:8px 15px;border-radius:5px;cursor:pointer;font-size:14px;}
.filters{display:flex;gap:10px;padding:10px;background:#111;flex-wrap:wrap;}
select{padding:10px;background:#222;color:white;border:none;}
.search-box{padding:10px;background:#111;}
.search-box input{width:100%;padding:10px;background:#222;color:white;border:none;}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px;}
.card{background:#111;border-radius:10px;overflow:hidden;box-shadow:0 0 10px rgba(0,0,0,0.5);}
.card img{width:100%;height:200px;object-fit:cover;}
.card-content{padding:15px;}
.price{color:#00ffcc;font-size:18px;}
.old-price{text-decoration:line-through;color:red;}
button{padding:8px;margin-top:5px;border:none;cursor:pointer;background:#00ffcc;color:black;border-radius:5px;}
.cart-box{padding:20px;background:#111;margin:20px;border-radius:10px;}
.qty-btn{font-size:20px;padding:8px 12px;margin:5px;}
.qty-number{font-size:18px;font-weight:bold;margin:0 10px;}
</style>
</head>

<body>

<header>
DCCV Hardware Supply
<div class="admin-btn" onclick="goAdmin()">Admin Panel</div>
</header>

<div class="filters">
<select id="categoryFilter" onchange="applyFilter()">
<option value="">All Category</option>
</select>

<select id="subCategoryFilter" onchange="applyFilter()">
<option value="">All Subcategory</option>
</select>
</div>

<div class="search-box">
<input id="searchInput" placeholder="Search products..." onkeyup="searchProducts()">
</div>

<div class="products" id="productList"></div>

<div class="cart-box">
<h2>🛒 Cart</h2>
<div id="cartItems"></div>
<h3 id="total">Total: ₹0</h3>
<input id="custName" placeholder="Your Name" style="padding:10px;width:100%;margin:5px 0;">
<input id="custPhone" placeholder="Phone Number" style="padding:10px;width:100%;margin:5px 0;">
<button onclick="payUPI()">💳 Pay via UPI</button>
<button onclick="downloadInvoice()">🧾 Download Invoice</button>
<button onclick="placeOrder()">Place Order</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
  storageBucket: "YOUR_BUCKET",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allProducts = [];
let cart = [];

const productList = document.getElementById("productList");
const categoryFilter = document.getElementById("categoryFilter");
const subCategoryFilter = document.getElementById("subCategoryFilter");

// LOAD PRODUCTS FROM FIRESTORE
const hardwareRef = collection(db, "hardware");
const q = query(hardwareRef, orderBy("createdAt","desc"));

onSnapshot(q, snapshot=>{
  allProducts = [];
  snapshot.forEach(doc=>{
    allProducts.push({...doc.data(), id: doc.id});
  });
  loadFilters();
  displayProducts(allProducts);
});

// FILTERS
function loadFilters(){
  let categories = [...new Set(allProducts.map(p=>p.category))];
  categoryFilter.innerHTML = `<option value="">All Category</option>`;
  categories.forEach(cat=>{
    categoryFilter.innerHTML += `<option value="${cat}">${cat}</option>`;
  });
}

function applyFilter(){
  let cat = categoryFilter.value;
  let sub = subCategoryFilter.value;
  let filtered = allProducts.filter(p=>{
    return (!cat || p.category===cat) && (!sub || p.subCategory===sub);
  });
  displayProducts(filtered);

  let subs = [...new Set(allProducts.filter(p=>!cat || p.category===cat).map(p=>p.subCategory))];
  subCategoryFilter.innerHTML = `<option value="">All Subcategory</option>`;
  subs.forEach(s=>{
    subCategoryFilter.innerHTML += `<option value="${s}">${s}</option>`;
  });
}

function searchProducts(){
  let val = document.getElementById("searchInput").value.toLowerCase();
  let filtered = allProducts.filter(p=> 
    p.name.toLowerCase().includes(val) ||
    p.category.toLowerCase().includes(val) ||
    p.subCategory.toLowerCase().includes(val)
  );
  displayProducts(filtered);
}

// DISPLAY PRODUCTS
function displayProducts(products){
  productList.innerHTML = "";
  products.forEach((p,index)=>{
    let finalPrice = p.price - (p.price * (p.discount||0)/100);
    productList.innerHTML += `
    <div class="card">
      <img src="${p.image}" alt="${p.name}">
      <div class="card-content">
        <h3>${p.name}</h3>
        <p>${p.description}</p>
        <p>Size: ${p.size}</p>
        <p>Stock: ${p.quantity}</p>
        <p class="price">₹${finalPrice.toFixed(2)} <span class="old-price">₹${p.price}</span></p>
        <button onclick="addToCart(${index})">Add to Cart</button>
      </div>
    </div>
    `;
  });
}

// CART FUNCTIONS
function addToCart(index){
  let product = allProducts[index];
  let existing = cart.find(item=>item.id===product.id);
  if(existing){ existing.qty++; } 
  else{ cart.push({...product, qty:1}); }
  updateCart();
}

function updateCart(){
  let cartDiv = document.getElementById("cartItems");
  let total = 0;
  cartDiv.innerHTML = "";
  cart.forEach((item,i)=>{
    let price = item.price - (item.price*(item.discount||0)/100);
    let subtotal = price*item.qty;
    total += subtotal;
    cartDiv.innerHTML += `
      <div>
      ${item.name} (₹${price})<br>
      Qty: <button class="qty-btn" onclick="changeQty(${i},-1)">-</button>
      <span class="qty-number">${item.qty}</span>
      <button class="qty-btn" onclick="changeQty(${i},1)">+</button><br>
      = ₹${subtotal.toFixed(2)}
      </div><hr>
    `;
  });
  document.getElementById("total").innerText = "Total: ₹" + total.toFixed(2);
}

function changeQty(i,change){
  cart[i].qty += change;
  if(cart[i].qty<=0){ cart.splice(i,1); }
  updateCart();
}

function payUPI(){
  let amount = document.getElementById("total").innerText.replace("Total: ₹","");
  window.location = `upi://pay?pa=deychoudhurybinit@oksbi&pn=DCCV&am=${amount}&cu=INR`;
}

function downloadInvoice(){
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  doc.text("DCCV Hardware Invoice",20,20);
  let y=40;
  cart.forEach(item=>{
    doc.text(`${item.name} x ${item.qty}`,20,y);
    y+=10;
  });
  doc.text(document.getElementById("total").innerText,20,y+10);
  doc.save("DCCV-Invoice.pdf");
}

function placeOrder(){
  let name = document.getElementById("custName").value;
  let phone = document.getElementById("custPhone").value;
  if(cart.length===0){ alert("Cart empty!"); return; }
  let msg = "New Order:\n";
  cart.forEach(item=>{ msg += `${item.name} x ${item.qty}\n`; });
  msg += `\nCustomer: ${name}\nPhone: ${phone}`;
  let url = `https://wa.me/91XXXXXXXXXX?text=${encodeURIComponent(msg)}`;
  window.open(url);
  alert("Order Sent!");
  cart=[];
  updateCart();
}

// NAVIGATE TO ADMIN
function goAdmin(){ window.location.href="admin-hardware.html"; }

</script>
</body>
</html>
