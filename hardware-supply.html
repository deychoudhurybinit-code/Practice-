<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Supply | DCCV</title>

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:#fff;
}

header{
background:#0b1f3a;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.filters{
display:flex;
gap:10px;
padding:10px;
background:#111;
}

select{
padding:10px;
background:#222;
color:white;
border:none;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
border-radius:10px;
overflow:hidden;
box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.price{
color:#00ffcc;
font-size:18px;
}

.old-price{
text-decoration:line-through;
color:red;
}

</style>
</head>

<body>

<header>DCCV Hardware Supply</header>

<div class="filters">
<select id="categoryFilter">
<option value="">All Category</option>
</select>

<select id="subCategoryFilter">
<option value="">All Subcategory</option>
</select>
</div>

<div class="products" id="productList"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID",
storageBucket: "YOUR_BUCKET",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const productList = document.getElementById("productList");

function loadProducts(){
db.collection("hardware").onSnapshot(snapshot=>{
productList.innerHTML = "";

snapshot.forEach(doc=>{
const p = doc.data();

let finalPrice = p.price - (p.price * p.discount / 100);

let card = `
<div class="card">
<img src="${p.image}">
<div class="card-content">
<h3>${p.name}</h3>
<p>${p.description}</p>
<p>Size: ${p.size}</p>
<p>Stock: ${p.quantity}</p>

<p class="price">
₹${finalPrice.toFixed(2)}
<span class="old-price">₹${p.price}</span>
</p>
</div>
</div>
`;

productList.innerHTML += card;
});
});
}

loadProducts();
</script>

</body>
</html>
