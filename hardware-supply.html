<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Supply | DCCV</title>

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:#fff;
}

header{
background:#0b1f3a;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
position:relative;
}

/* ADMIN BUTTON */
.admin-btn{
position:absolute;
right:20px;
top:15px;
background:#00ffcc;
color:black;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
font-size:14px;
}

/* FILTER */
.filters{
display:flex;
gap:10px;
padding:10px;
background:#111;
flex-wrap:wrap;
}

select{
padding:10px;
background:#222;
color:white;
border:none;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
border-radius:10px;
overflow:hidden;
box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.price{
color:#00ffcc;
font-size:18px;
}

.old-price{
text-decoration:line-through;
color:red;
}
</style>
</head>

<body>

<header>
DCCV Hardware Supply
<div class="admin-btn" onclick="goAdmin()">Admin Panel</div>
</header>

<div class="filters">
<select id="categoryFilter" onchange="applyFilter()">
<option value="">All Category</option>
</select>

<select id="subCategoryFilter" onchange="applyFilter()">
<option value="">All Subcategory</option>
</select>
</div>

<div class="products" id="productList"></div>

<script>
// 🔥 DEMO PRODUCTS (5 items, 2 categories)
let allProducts = [
{
name:"TMT Bar 12mm",
category:"Steel",
subCategory:"TMT",
size:"12mm",
price:600,
discount:10,
quantity:50,
description:"High strength TMT bar",
image:"https://via.placeholder.com/300"
},
{
name:"TMT Bar 16mm",
category:"Steel",
subCategory:"TMT",
size:"16mm",
price:750,
discount:5,
quantity:40,
description:"Durable steel rod",
image:"https://via.placeholder.com/300"
},
{
name:"Binding Wire",
category:"Steel",
subCategory:"Accessories",
size:"1kg",
price:80,
discount:0,
quantity:100,
description:"Strong binding wire",
image:"https://via.placeholder.com/300"
},
{
name:"OPC Cement",
category:"Cement",
subCategory:"OPC",
size:"50kg",
price:420,
discount:8,
quantity:200,
description:"Premium OPC cement",
image:"https://via.placeholder.com/300"
},
{
name:"PPC Cement",
category:"Cement",
subCategory:"PPC",
size:"50kg",
price:390,
discount:5,
quantity:180,
description:"High quality PPC cement",
image:"https://via.placeholder.com/300"
}
];

const productList = document.getElementById("productList");
const categoryFilter = document.getElementById("categoryFilter");
const subCategoryFilter = document.getElementById("subCategoryFilter");

// LOAD FILTER OPTIONS
function loadFilters(){
let categories = [...new Set(allProducts.map(p=>p.category))];

categories.forEach(cat=>{
categoryFilter.innerHTML += `<option value="${cat}">${cat}</option>`;
});
}

// APPLY FILTER
function applyFilter(){
let cat = categoryFilter.value;
let sub = subCategoryFilter.value;

let filtered = allProducts.filter(p=>{
return (!cat || p.category===cat) &&
(!sub || p.subCategory===sub);
});

displayProducts(filtered);

// update subcategory dynamically
let subs = [...new Set(
allProducts
.filter(p=>!cat || p.category===cat)
.map(p=>p.subCategory)
)];

subCategoryFilter.innerHTML = `<option value="">All Subcategory</option>`;
subs.forEach(s=>{
subCategoryFilter.innerHTML += `<option value="${s}">${s}</option>`;
});
}

// DISPLAY PRODUCTS
function displayProducts(products){
productList.innerHTML="";

products.forEach(p=>{
let finalPrice = p.price - (p.price * p.discount / 100);

productList.innerHTML += `
<div class="card">
<img src="${p.image}">
<div class="card-content">
<h3>${p.name}</h3>
<p>${p.description}</p>
<p>Size: ${p.size}</p>
<p>Stock: ${p.quantity}</p>

<p class="price">
₹${finalPrice.toFixed(2)}
<span class="old-price">₹${p.price}</span>
</p>
</div>
</div>
`;
});
}

// ADMIN NAVIGATION
function goAdmin(){
window.location.href = "admin-hardware.html";
}

// INIT
loadFilters();
displayProducts(allProducts);
</script>

</body>
</html>
