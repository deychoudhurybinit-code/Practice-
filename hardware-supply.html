<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCCV Hardware Store</title>

<style>
body{margin:0;font-family:Arial;background:#000;color:#fff;}

header{
background:#0b1f3a;
padding:15px;
text-align:center;
font-size:22px;
position:relative;
}

.admin-btn{
position:absolute;
right:20px;
top:15px;
background:#00ffcc;
color:black;
padding:8px;
cursor:pointer;
}

/* LOGIN */
.login-box{
background:#111;
padding:20px;
text-align:center;
}

input{
padding:10px;
margin:5px;
width:90%;
max-width:300px;
}

button{
padding:10px;
margin-top:5px;
border:none;
cursor:pointer;
background:#00ffcc;
color:black;
width:90%;
max-width:300px;
}

/* SEARCH */
.search-box{padding:10px;background:#111;text-align:center;}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{background:#111;border-radius:10px;overflow:hidden;}
.card img{width:100%;height:200px;object-fit:cover;}
.card-content{padding:15px;}

.cart-box{
background:#111;
margin:20px;
padding:20px;
border-radius:10px;
}

.qty-btn{
font-size:18px;
padding:5px 10px;
margin:5px;
}
</style>
</head>

<body>

<header>
DCCV Hardware
<div class="admin-btn" onclick="alert('Admin Page')">Admin</div>
</header>

<!-- LOGIN -->
<div class="login-box">
<h3>Customer Login</h3>
<input id="email" placeholder="Email">
<input id="password" placeholder="Password" type="password">
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
<p id="userStatus"></p>
</div>

<!-- SEARCH -->
<div class="search-box">
<input id="search" placeholder="Search..." onkeyup="searchProducts()">
</div>

<div class="products" id="productList"></div>

<!-- CART -->
<div class="cart-box">
<h2>🛒 Cart</h2>
<div id="cartItems"></div>
<h2 id="total">Total: ₹0</h2>

<input id="custName" placeholder="Your Name">
<input id="custPhone" placeholder="Phone">

<button onclick="payUPI()">💳 Pay via UPI</button>
<button onclick="downloadInvoice()">🧾 Download Invoice (PDF)</button>
<button onclick="placeOrder()">📦 Place Order</button>
</div>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

// PRODUCTS
let allProducts=[
{name:"TMT Bar",price:600,discount:10,image:"https://via.placeholder.com/300"},
{name:"Cement OPC",price:420,discount:5,image:"https://via.placeholder.com/300"},
{name:"Binding Wire",price:80,discount:0,image:"https://via.placeholder.com/300"}
];

let cart=[];
let currentUser=null;

// DISPLAY PRODUCTS
function displayProducts(p){
productList.innerHTML="";
p.forEach((item,i)=>{
let price=item.price-(item.price*item.discount/100);

productList.innerHTML+=`
<div class="card">
<img src="${item.image}">
<div class="card-content">
<h3>${item.name}</h3>
<p>₹${price}</p>
<button onclick="addToCart(${i})">Add to Cart</button>
</div>
</div>
`;
});
}

// SEARCH
function searchProducts(){
let val=search.value.toLowerCase();
let filtered=allProducts.filter(p=>p.name.toLowerCase().includes(val));
displayProducts(filtered);
}

// CART
function addToCart(i){
let item=allProducts[i];
let exist=cart.find(x=>x.name===item.name);
if(exist) exist.qty++;
else cart.push({...item,qty:1});
updateCart();
}

function updateCart(){
cartItems.innerHTML="";
let total=0;

cart.forEach((item,i)=>{
let price=item.price-(item.price*item.discount/100);
let sub=price*item.qty;
total+=sub;

cartItems.innerHTML+=`
<div>
${item.name} - ₹${sub}<br>
<button class="qty-btn" onclick="changeQty(${i},-1)">-</button>
${item.qty}
<button class="qty-btn" onclick="changeQty(${i},1)">+</button>
<hr>
</div>`;
});

total.innerText="Total: ₹"+total;
}

function changeQty(i,c){
cart[i].qty+=c;
if(cart[i].qty<=0) cart.splice(i,1);
updateCart();
}

// UPI PAYMENT
function payUPI(){
let amt=total.innerText.replace("Total: ₹","");
window.location=`upi://pay?pa=deychoudhurybinit@oksbi&pn=DCCV&am=${amt}&cu=INR`;
}

// PDF INVOICE
function downloadInvoice(){
const { jsPDF } = window.jspdf;
let doc=new jsPDF();

doc.text("DCCV Invoice",20,20);

let y=40;
cart.forEach(item=>{
doc.text(`${item.name} x ${item.qty}`,20,y);
y+=10;
});

doc.text(total.innerText,20,y+10);

doc.save("invoice.pdf");
}

// ORDER
function placeOrder(){
if(!currentUser){
alert("Login first!");
return;
}
alert("Order placed!");
cart=[];
updateCart();
}

// LOGIN SYSTEM (basic demo)
function signup(){
let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;
localStorage.setItem(email,pass);
alert("Signup done");
}

function login(){
let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;

if(localStorage.getItem(email)===pass){
currentUser=email;
userStatus.innerText="Logged in: "+email;
}else{
alert("Invalid login");
}
}

// INIT
displayProducts(allProducts);

</script>

</body>
</html>
